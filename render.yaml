# One-instance production starter. Use managed Postgres and a persistent disk.
# For horizontal scaling, replace disk media with an object-storage implementation.
services:
  - type: web
    name: spacebox-website
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: spacebox-db
          property: connectionString
      - key: MEDIA_DIR
        value: /var/data/uploads
      - key: SITE_URL
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: APP_SECRET
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: CONTACT_PHONE
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: NOTIFY_EMAIL
        sync: false
    disk:
      name: spacebox-media
      mountPath: /var/data
      sizeGB: 1
databases:
  - name: spacebox-db
    databaseName: spacebox
    user: spacebox
